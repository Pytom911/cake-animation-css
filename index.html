<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kue Ulang Tahun</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div
        class="birthday-cake"
        role="button"
        tabindex="0"
        aria-pressed="false"
        aria-label="Kue ulang tahun dengan satu lilin menyala di atas stand perak. Tekan untuk meniup lilin."
    >

        <div class="glow"></div>
        <div class="shadow"></div>

        <div class="pedestal"></div>
        <div class="plate-edge"></div>

        <div class="pedestal-base"></div>

        <div class="cake-top"></div>

        <div class="cake">

            <i class="drip" style="--x:-6;  --w:24; --h:42; --r:12px;   --d:0s;    --t:0.52s"></i>
            <i class="drip" style="--x:20;  --w:16; --h:58; --r:8px;    --d:0.07s; --t:0.62s"></i>
            <i class="drip" style="--x:42;  --w:11; --h:32; --r:999px;  --d:0.15s; --t:0.4s"></i>
            <i class="drip" style="--x:58;  --w:21; --h:48; --r:11px;   --d:0.04s; --t:0.55s"></i>
            <i class="drip" style="--x:84;  --w:13; --h:28; --r:999px;  --d:0.19s; --t:0.36s"></i>
            <i class="drip" style="--x:102; --w:27; --h:74; --r:14px;   --d:0.11s; --t:0.7s"></i>
            <i class="drip" style="--x:133; --w:15; --h:34; --r:8px;    --d:0.23s; --t:0.44s"></i>
            <i class="drip" style="--x:152; --w:22; --h:52; --r:11px;   --d:0.02s; --t:0.58s"></i>
            <i class="drip" style="--x:178; --w:10; --h:84; --r:999px;  --d:0.16s; --t:0.68s"></i>
            <i class="drip" style="--x:193; --w:25; --h:38; --r:12px;   --d:0.09s; --t:0.46s"></i>
            <i class="drip" style="--x:222; --w:14; --h:56; --r:999px;  --d:0.21s; --t:0.6s"></i>
            <i class="drip" style="--x:241; --w:20; --h:30; --r:10px;   --d:0.26s; --t:0.38s"></i>
            <i class="drip" style="--x:265; --w:16; --h:46; --r:8px;    --d:0.06s; --t:0.5s"></i>

            <i class="sprinkle sprinkle--a"></i>
            <i class="sprinkle sprinkle--b"></i>
            <i class="sprinkle sprinkle--c"></i>
            <i class="sprinkle sprinkle--d"></i>

            <div class="cake-shading"></div>

        </div>

        <div class="plate-rim"></div>

        <div class="cake-contact"></div>

        <div class="candle"></div>
        <div class="flame"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
