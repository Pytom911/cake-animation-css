<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kue Ulang Tahun</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div
        class="birthday-cake"
        role="button"
        tabindex="0"
        aria-pressed="false"
        aria-label="Kue ulang tahun dengan satu lilin menyala di atas stand perak. Tekan untuk meniup lilin."
    >

        <div class="glow"></div>
        <div class="shadow"></div>

        <div class="pedestal"></div>
        <div class="plate-edge"></div>

        <div class="pedestal-base"></div>

        <div class="cake">
            <div class="chocolate"></div>
        </div>

        <div class="plate-rim"></div>

        <div class="candle"></div>
        <div class="flame"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
